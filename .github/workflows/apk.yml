name: Gerar APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrir o zip
        working-directory: ${{ github.workspace }}
        run: unzip -q -o MANU-OFFROAD-github.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar
        working-directory: MANU-OFFROAD-github
        run: npm install
      - name: Criar Android
        working-directory: MANU-OFFROAD-github
        run: npx cap add android && npx cap sync android
      - name: Compilar APK
        working-directory: MANU-OFFROAD-github/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MANU-OFFROAD
          path: MANU-OFFROAD-github/android/app/build/outputs/apk/debug/app-debug.apk
