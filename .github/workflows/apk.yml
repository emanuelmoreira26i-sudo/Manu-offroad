name: Gerar APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrir o zip
        working-directory: ${{ github.workspace }}
        run: unzip -q -o MANU-OFFROAD-github.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar
        working-directory: MANU-OFFROAD-github
        run: npm install
      - name: Criar Android
        working-directory: MANU-OFFROAD-github
        run: npx cap add android && npx cap sync android
      - name: Colocar o icone
        working-directory: MANU-OFFROAD-github
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          src = Image.open('www/icon-512.png').convert('RGBA')
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              p = res + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              im = src.resize((s, s), Image.LANCZOS)
              for n in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  im.save(p + '/' + n)
          PY
      - name: Compilar APK
        working-directory: MANU-OFFROAD-github/android
        run: ./gradlew assembl
